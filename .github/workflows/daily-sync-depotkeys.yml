name: Daily Sync DepotKeys

on:
  schedule:
    # 北京时间 00:00，对应UTC 16点
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download depotkeys.json
        run: |
          if ! wget -O depotkeys.json https://api.993499094.xyz/depotkeys.json; then
            echo "Download failed, skip run"
            exit 0
          fi

      - name: Zip the json file
        run: |
          zip depotkeys.zip depotkeys.json

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push changes
        run: |
          git add depotkeys.zip
          if git diff --cached --quiet; then
            echo "No file changes, skip commit & push"
          else
            git commit -m "🤖 Auto sync depotkeys $(date '+%Y-%m-%d')"
            git push origin main
          fi
